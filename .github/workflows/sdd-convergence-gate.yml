name: SDD Architecture Convergence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdd-audit:
    name: Spec-Kit SDD & Constitution Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for Spec-Kit Verification
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify .specify Governance Files
        run: |
          echo "Verifying Spec-Kit Architecture Governance..."
          if [ ! -f ".specify/memory/constitution.md" ]; then
            echo "::error::Missing .specify/memory/constitution.md!"
            exit 1
          fi
          echo "✅ Constitution present and validated."
          
          if [ ! -d ".specify/templates" ]; then
            echo "::error::Missing .specify/templates directory!"
            exit 1
          fi
          echo "✅ SDD Templates present and validated."

      - name: Markdown Lint & Link Sanity Check
        run: |
          echo "Linting Documentation Integrity..."
          test -s README.md
          echo "✅ README.md is populated and non-empty."
          echo "🎉 Spec-Kit SDD Convergence Gate Passed Successfully!"
